name: CI

# Layers 1-2 (contracts/testing-strategy.md, ADR 0024): unit + contract tests, no
# cluster needed. Runs on every push and PR; branch protection on main requires this
# to pass before merge.
#
# booth-design isn't a BoothModule (no manifest/Helm chart of its own — it's mandatory
# shell chrome hosted directly by booth-core, per MODULE_REGISTRY.md's nav-group note),
# so there's no layer-3 real-cluster/CRD workflow or helm-lint job here the way
# booth-core/booth-module-store have. "Contract tests" for this repo means validating
# this shell's own assumptions against contracts/module-manifest.md's navGroup and
# uiIntegrationMode enums (src/lib/__tests__/manifest.test.ts), and that the real
# @projectbooth/module-store-ui package actually satisfies the NativeModuleProps
# contract it's registered against (src/__tests__/nativeModuleRegistrations.test.ts)
# — both run as part of the ordinary test suite below, not a separate job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read # npm ci needs to pull @projectbooth/module-store-ui from GitHub Packages

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # Scopes @projectbooth to GitHub Packages (matching the committed .npmrc);
          # everything else still resolves from the default public npm registry.
          registry-url: "https://npm.pkg.github.com"
          scope: "@projectbooth"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + contract tests
        run: npm test -- --run

      - name: Build
        run: npm run build
