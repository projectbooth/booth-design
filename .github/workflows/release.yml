name: Release

# ADR 0111: pushing a `vX.Y.Z` tag publishes the container image
# (ghcr.io/projectbooth/booth-design:X.Y.Z and :latest) and the Helm chart at a matching
# version -- both as a GitHub release asset and as an OCI artifact
# (oci://ghcr.io/projectbooth/charts/booth-design), so booth-core's install API
# (ParseChartRef, ADR 0028) and a hand-run `helm install` both have a real, versioned
# reference to pin to instead of main at an arbitrary commit. Modelled on booth-core's
# release.yml (the fuller shape, with the OCI push step booth-storage's current
# release.yml -- otherwise the model named in this repo's own notes -- doesn't yet have).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/projectbooth/booth-design:${{ steps.version.outputs.version }}
            ghcr.io/projectbooth/booth-design:latest
          # @projectbooth/module-store-ui (ADR 0030) is on GitHub Packages, which needs a
          # token even to read -- same secret, same mechanism (BuildKit secret, id
          # "npm_token") as ci.yml's `image` job and the Dockerfile's own doc comment.
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

  chart:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # charts/booth-design/Chart.yaml declares no `dependencies`, so there's nothing for
      # `helm dependency update` to resolve -- skipped rather than carried as a no-op step.

      - name: Package chart at the release version
        working-directory: charts/booth-design
        run: |
          helm package . \
            --version "${{ needs.image.outputs.version }}" \
            --app-version "${{ needs.image.outputs.version }}" \
            --destination ../../dist

      - name: Attach chart to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true

      - name: helm registry login (ghcr.io)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Push chart as an OCI artifact (ADR 0111)
        run: helm push dist/booth-design-${{ needs.image.outputs.version }}.tgz oci://ghcr.io/projectbooth/charts
